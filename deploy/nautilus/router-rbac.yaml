# The gateway (pickspin serve) and the router (pickspin live --servers) create and delete the model server
# Jobs and read their pods, and the logs of a server that failed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bhanu-pickspin-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bhanu-pickspin-router
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bhanu-pickspin-router
subjects:
  - kind: ServiceAccount
    name: bhanu-pickspin-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bhanu-pickspin-router
