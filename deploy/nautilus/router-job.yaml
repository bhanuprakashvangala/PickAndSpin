# Runs `pickspin live` on Nautilus (CPU only) with the paper's nine models (servers-paper.json). Stop the
# gateway first: both manage the same server Jobs. RUN_NAME, LIMIT and EXTRA_ARGS select the run:
#   smoke test:   LIMIT=200      EXTRA_ARGS=""
#   full run:     LIMIT=0        EXTRA_ARGS=""
#   static run:   LIMIT=0        EXTRA_ARGS="--static"   (start every server first: kubectl apply -f jobs-paper.json)
# Results go to the bhanu-pickspin-results volume under /results/$RUN_NAME.
apiVersion: batch/v1
kind: Job
metadata:
  name: bhanu-pickspin-router-paper
spec:
  backoffLimit: 2  # a lost node retries; existing server Jobs are adopted
  activeDeadlineSeconds: 28800
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: bhanu-pickspin-router
      nodeSelector: {kubernetes.io/arch: amd64}
      containers:
      - name: router
        image: ghcr.io/bhanuprakashvangala/pick-and-spin:main
        imagePullPolicy: Always
        command: ["bash", "-c"]
        args:
        - |
          pickspin live --servers deploy/nautilus/servers-paper.json --endpoints deploy/nautilus/endpoints-paper.json \
            --namespace "$NAMESPACE" --workers "$WORKERS" --limit "$LIMIT" --out "/results/$RUN_NAME" $EXTRA_ARGS
        env:
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: RUN_NAME, value: paper-smoke-200}
        - {name: LIMIT, value: "200"}
        - {name: WORKERS, value: "20"}
        - {name: EXTRA_ARGS, value: ""}
        - name: NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        resources:
          requests: {cpu: "4", memory: 8Gi}
          limits: {cpu: "4", memory: 8Gi}
        volumeMounts:
        - {name: results, mountPath: /results}
      volumes:
      - name: results
        persistentVolumeClaim: {claimName: bhanu-pickspin-results}
