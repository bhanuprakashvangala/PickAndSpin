# Runs the Pick and Spin router (`pickspin live`, CPU only) inside the cluster against the model
# Services. Build and push an image from this repository first (see deploy/Dockerfile and the
# README) and set its name below. The ServiceAccount comes from the Helm chart.
apiVersion: batch/v1
kind: Job
metadata:
  name: pick-and-spin-router
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pick-and-spin-router
      containers:
        - name: router
          image: REPLACE_WITH_YOUR_IMAGE
          command: ["pickspin", "live", "--endpoints", "deploy/endpoints.example.json", "--workers", "250"]
          env:
            - name: PS_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          resources:
            requests: {cpu: "4", memory: 8Gi}
            limits: {cpu: "8", memory: 16Gi}
