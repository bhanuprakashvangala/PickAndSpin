# Runs the Pick and Spin router (`pickspin live`, CPU only) inside the cluster against the model
# Services, with the image that CI publishes from deploy/Dockerfile (or one you build from it and set
# below). The ServiceAccount comes from the Helm chart.
apiVersion: batch/v1
kind: Job
metadata:
  name: pick-and-spin-router
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pick-and-spin-router
      containers:
        - name: router
          image: ghcr.io/bhanuprakashvangala/pick-and-spin:latest
          command: ["pickspin", "live", "--endpoints", "deploy/endpoints.example.json", "--workers", "250"]
          env:
            - name: PS_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          resources:
            requests: {cpu: "4", memory: 8Gi}
            limits: {cpu: "8", memory: 16Gi}
