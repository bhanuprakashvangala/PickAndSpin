{{- /* Created only when the token is given at install time (--set global.hfToken=...); otherwise the
       Secret named global.hfTokenSecret must already exist, or the models must be ungated. */}}
{{- if .Values.global.hfToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.hfTokenSecret }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.global.hfToken | quote }}
{{- end }}
