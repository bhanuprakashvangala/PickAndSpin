# Nine models from three families, one vLLM Deployment + Service each.
# Spin scales an idle model to 0 replicas (COLD) and back to 1 (WARM);
# set replicas: 0 here to start a model cold.

image: vllm/vllm-openai:v0.6.3
imagePullPolicy: IfNotPresent

# Shared weight cache (Hugging Face cache on a ReadWriteMany volume).
storage:
  create: true
  storageClass: ""          # e.g. a CephFS class; empty uses the cluster default
  size: 300Gi
  accessMode: ReadWriteMany

# Name of an existing Secret holding HF_TOKEN (needed for gated Llama/Gemma weights).
# kubectl create secret generic hf-token --from-literal=HF_TOKEN=...
hfTokenSecret: hf-token

gpuResource: nvidia.com/gpu
nodeSelector: {}
tolerations: []

models:
  llama32-1b:  {key: llama3.2_1B,  hfModel: meta-llama/Llama-3.2-1B-Instruct, replicas: 1, gpus: 1, memory: 16Gi, maxModelLen: 4096}
  qwen25-1-5b: {key: qwen2.5_1.5B, hfModel: Qwen/Qwen2.5-1.5B-Instruct,       replicas: 1, gpus: 1, memory: 16Gi, maxModelLen: 4096}
  gemma2-2b:   {key: gemma2_2B,    hfModel: google/gemma-2-2b-it,             replicas: 1, gpus: 1, memory: 16Gi, maxModelLen: 4096}
  llama32-3b:  {key: llama3.2_3B,  hfModel: meta-llama/Llama-3.2-3B-Instruct, replicas: 1, gpus: 1, memory: 24Gi, maxModelLen: 4096}
  qwen25-7b:   {key: qwen2.5_7B,   hfModel: Qwen/Qwen2.5-7B-Instruct,         replicas: 1, gpus: 1, memory: 32Gi, maxModelLen: 4096}
  llama31-8b:  {key: llama3.1_8B,  hfModel: meta-llama/Llama-3.1-8B-Instruct, replicas: 1, gpus: 1, memory: 32Gi, maxModelLen: 4096}
  gemma2-9b:   {key: gemma2_9B,    hfModel: google/gemma-2-9b-it,             replicas: 1, gpus: 1, memory: 32Gi, maxModelLen: 4096}
  qwen25-14b:  {key: qwen2.5_14B,  hfModel: Qwen/Qwen2.5-14B-Instruct,        replicas: 1, gpus: 1, memory: 48Gi, maxModelLen: 4096}
  gemma2-27b:  {key: gemma2_27B,   hfModel: google/gemma-2-27b-it,            replicas: 1, gpus: 1, memory: 96Gi, maxModelLen: 4096}
