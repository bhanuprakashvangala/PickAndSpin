[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pick-and-spin"
version = "2.0.0"
description = "Pick and Spin: cold-start-aware routing for self-hosted LLM serving (IEEE CLOUD 2026)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Bhanu Prakash Vangala" },
    { name = "Tanu Malik" },
]
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.7",
    "requests>=2.31",
]

[project.optional-dependencies]
# Live runs on Kubernetes (`pickspin live` without --static).
live = ["kubernetes>=29.0"]
# DistilBERT stage of the hybrid classifier. TrainingArguments(eval_strategy=...) needs transformers 4.41.
classifier = ["torch>=2.1", "transformers>=4.41"]
# Fine-tuning DistilBERT (`pickspin classifier train`).
train = [
    "pick-and-spin[classifier]",
    "datasets>=2.18",
    "accelerate>=0.26",
    "scikit-learn>=1.3",
    "seaborn>=0.13",
    "numpy>=1.24",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
    "pre-commit>=3",
]

[project.scripts]
pickspin = "pickspin.cli.main:main"

[project.urls]
Paper = "https://bhanuprakashvangala.github.io/files/papers/pick-and-spin.pdf"
Repository = "https://github.com/bhanuprakashvangala/PickAndSpin"

[tool.hatch.build.targets.wheel]
packages = ["src/pickspin"]

[tool.hatch.build.targets.sdist]
# data/, results/, models/, deploy/ and legacy/ never ship.
only-include = [
    "src",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "T20", "PT"]
# B905 (zip without strict=) stays off so ported zip() calls stay verbatim.
ignore = ["B905"]

[tool.ruff.lint.flake8-bugbear]
# Path('.') is the default of the Paths dataclass.
extend-immutable-calls = ["pathlib.Path"]

[tool.ruff.lint.per-file-ignores]
# Only the command line, developer scripts and tests may print; everything else logs.
"src/pickspin/cli/*.py" = ["T20"]
"scripts/*.py" = ["T20"]
"tests/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["pickspin"]

[tool.mypy]
files = ["src/pickspin"]
exclude = ["^legacy/"]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "datasets.*", "sklearn.*", "seaborn.*", "kubernetes.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# transformers.Trainer is untyped.
module = ["pickspin.training.finetune"]
disallow_subclassing_any = false
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["slow: full-dataset runs (golden simulator outputs, DistilBERT)"]
# The pytest defaults, plus legacy/ (frozen provenance code) and data/ directories (tests/data holds goldens).
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "legacy", "data"]

[tool.coverage.run]
source = ["pickspin"]
branch = true
omit = ["*/pickspin/training/finetune.py"]
