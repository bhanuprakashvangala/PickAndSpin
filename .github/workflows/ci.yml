name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # The authors' platform: catches CRLF and path problems.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m "not slow" --cov

  base-install:
    # No extras: proves that torch, transformers and kubernetes are optional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install . pytest
      - run: pytest tests/unit/test_import_hygiene.py
      - run: pickspin --version
      - name: Reproduce the paper's numbers (exits non-zero unless all 84 match)
        run: pickspin reproduce --out "$RUNNER_TEMP/reproduce"
      - name: The tables match the committed ones byte for byte and every figure is written
        run: |
          for f in results/*.csv; do cmp "$f" "$RUNNER_TEMP/reproduce/$(basename "$f")"; done
          for f in results/figures/*.png; do test -s "$RUNNER_TEMP/reproduce/figures/$(basename "$f")"; done

  golden:
    # Same-machine differential check against the frozen code at tag v1.1.0, so it is immune to
    # differences between platform math libraries. The committed goldens are for win32 / CPython 3.12.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: git worktree add ../baseline v1.1.0
      - run: python -m pip install -e ".[dev]"
      - name: Generate goldens from v1.1.0 on this runner
        run: python scripts/make_goldens.py --baseline ../baseline --out "$RUNNER_TEMP/golden"
      - name: Compare the current simulator with them
        run: PICKSPIN_GOLDEN_DIR="$RUNNER_TEMP/golden" pytest -m slow tests/integration/test_simulation_golden.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel holds only the pickspin package
        shell: python
        run: |
          import sys
          import zipfile
          from pathlib import Path

          (wheel,) = Path("dist").glob("*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          stray = [n for n in names if not n.startswith(("pickspin/", "pick_and_spin-2.0.0.dist-info/"))]
          if stray:
              sys.exit(f"{wheel.name} has members outside the package: {stray}")
          print(f"{wheel.name}: {len(names)} members, all under pickspin/ or its dist-info")
